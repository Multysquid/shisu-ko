name: Release extensions

# A tag makes a release and its signed .xpi, nothing more: the checks, the Firefox package signed
# by addons.mozilla.org for self-distribution, and the GitHub release with the zips and the .xpi.
# The public listing on addons.mozilla.org is a workflow of its own, amo-listing.yml, run by hand
# for the releases it should get.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_KEY: ${{ secrets.WEB_EXT_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-test.txt
      - run: python -m pytest server/tests
      - run: node --test addon/tests/*.test.js
      - run: for f in addon/*.js; do node --check "$f"; done
      # The build tests without the listing texts' (amo-metadata.test.mjs): a text AMO would refuse
      # is the listing's business and must not hold up the release; the Tests workflow checks it
      # on every push.
      - run: node --test $(ls scripts/tests/*.test.mjs | grep -v '/amo-metadata\.test\.mjs$')
      - run: npx --yes web-ext@10.7.0 lint --source-dir addon
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - name: Check tag version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./addon/manifest.json').version")" = "${GITHUB_REF_NAME}"
      # Regular Firefox only keeps signed add-ons. The built Firefox package is signed through
      # addons.mozilla.org (unlisted channel: self-distribution, no listing) with the AMO API key
      # kept in the repository secrets, before the release is made: web-ext uploads it, waits up to
      # a quarter of an hour for AMO to sign it and downloads the signed .xpi into dist/, and the
      # release carries it with the zips. A version AMO has not signed by then fails the job; AMO
      # takes a number once, so a re-run, once AMO has signed it, takes the signed file of the
      # first upload from AMO instead, and only when it holds this tag's build. Without the
      # secrets the release ships the unsigned zips.
      - name: Sign the Firefox package
        if: env.AMO_KEY == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          state="$(node scripts/amo-xpi.mjs status "$version")"
          if [ "$state" = missing ]; then
            npx --yes web-ext@10.7.0 sign --source-dir dist/firefox --artifacts-dir dist --channel unlisted --no-input
          else
            echo "::notice::AMO already has $version ($state) from an earlier run; its signed file is taken from AMO"
            node scripts/amo-xpi.mjs fetch "$version" --out dist --wait 900
            node scripts/amo-xpi.mjs same-build dist/*.xpi dist/firefox
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.xpi
