name: Attach the signed Firefox package

# The release workflow has each tag signed by addons.mozilla.org for self-distribution and waits a
# quarter of an hour for the signed file. A version AMO signs later is picked up here from AMO and
# attached to the GitHub release, once it is shown to hold the release's own Firefox build. The
# schedule asks AMO only while the newest release has no .xpi yet; an older one is attached by a
# run by hand with its tag (0.14.1's only file is its listed one, signed if AMO approves it).
# A version AMO has no file for is a warning (the release job may still be uploading it, or its
# upload failed: re-run that job); one AMO has rejected fails the run, since the release job has
# usually ended green before the rejection: answer the reviewer and release the next patch version.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default the newest release)
        required: false

permissions:
  contents: write

concurrency:
  group: amo-xpi
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      AMO_KEY: ${{ secrets.WEB_EXT_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.AMO_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.AMO_KEY == 'true'
        with:
          node-version: "22"
      - name: Attach the signed .xpi once AMO has signed it
        if: env.AMO_KEY == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-$(gh release view --json tagName --jq .tagName)}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if grep -q '\.xpi$' <<<"$assets"; then
            echo "$tag already has its .xpi"
            exit 0
          fi
          code=0
          node scripts/amo-xpi.mjs fetch "${tag#v}" --out dist/signed || code=$?
          case "$code" in
            0)
              gh release download "$tag" -p "shisu-ko-${tag#v}-firefox.zip" -D dist/release
              if ! node scripts/amo-xpi.mjs same-build dist/signed/*.xpi "dist/release/shisu-ko-${tag#v}-firefox.zip"; then
                echo "::error::AMO's signed ${tag#v} is not the Firefox build of the release $tag; it is not attached"
                exit 1
              fi
              gh release upload "$tag" dist/signed/*.xpi --clobber
              ;;
            3) echo "AMO has not signed $tag yet" ;;
            4)
              state="$(node scripts/amo-xpi.mjs status "${tag#v}")"
              if [ "$state" = disabled ]; then
                echo "::error::AMO has rejected ${tag#v}: answer the reviewer in the Developer Hub and release the next patch version"
                exit 1
              fi
              echo "::warning::AMO has no file for ${tag#v}: the release job may still be uploading it, or its upload failed (re-run that job)"
              ;;
            *) exit "$code" ;;
          esac
