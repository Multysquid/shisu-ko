<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" width="30" height="30">
    <div>
      <h1>Shisu-ko</h1>
      <div id="server-status" class="status">Checking server&hellip;</div>
    </div>
  </header>
  <main>
    <h2>Subtitles</h2>
    <label class="row">
      <input type="checkbox" id="enabled">
      <span>Show subtitles <kbd>Alt+Shift+S</kbd></span>
    </label>
    <label class="row">
      <input type="checkbox" id="pauseOnHover">
      <span>Pause the video while a subtitle is hovered (for Yomitan lookups)</span>
    </label>
    <label class="row">
      <input type="checkbox" id="showTranscript">
      <span>Show transcript panel <kbd>Alt+Shift+T</kbd></span>
    </label>
    <label class="row">
      <input type="checkbox" id="hideNativeCaptions">
      <span>Hide YouTube's own captions</span>
    </label>
    <label class="row">
      <input type="checkbox" id="showStatus">
      <span>Show progress messages on the video</span>
    </label>
    <label class="row range">
      <span>Font size <output id="fontScaleOut"></output></span>
      <input type="range" id="fontScale" min="0.6" max="2.2" step="0.05">
    </label>
    <label class="row range">
      <span>Keep subtitle after speech ends <output id="lingerOut"></output></span>
      <input type="range" id="lingerSeconds" min="0" max="8" step="0.5">
    </label>

    <h2>Sentence mining <kbd>Alt+Shift+M</kbd></h2>
    <p class="hint">Hover a subtitle and click &#9935;, or press the shortcut: the current frame and the sentence audio are captured.</p>
    <label class="row text">
      <span>Send screenshot and audio to</span>
      <select id="mineTarget">
        <option value="anki">Anki: the newest card (via AnkiConnect)</option>
        <option value="download">Downloads folder</option>
      </select>
    </label>
    <label class="row">
      <input type="checkbox" id="mineFallbackDownload">
      <span>If Anki is unreachable, save to Downloads instead</span>
    </label>
    <label class="row text">
      <span>AnkiConnect URL</span>
      <input type="text" id="ankiUrl" spellcheck="false">
    </label>
    <div class="grid">
      <label class="row text">
        <span>Image field</span>
        <input type="text" id="ankiImageField" spellcheck="false">
      </label>
      <label class="row text">
        <span>Audio field</span>
        <input type="text" id="ankiAudioField" spellcheck="false">
      </label>
    </div>
    <label class="row text">
      <span>Sentence field (optional, only filled when empty)</span>
      <input type="text" id="ankiSentenceField" spellcheck="false">
    </label>
    <label class="row range">
      <span>Audio padding around the sentence <output id="clipPaddingOut"></output></span>
      <input type="range" id="clipPaddingMs" min="0" max="1000" step="50">
    </label>
    <label class="row text">
      <span>Audio format</span>
      <select id="clipFormat">
        <option value="mp3">MP3 (small)</option>
        <option value="wav">WAV (uncompressed)</option>
      </select>
    </label>

    <h2>Server</h2>
    <label class="row text">
      <span>Shisu-ko server URL</span>
      <input type="text" id="serverUrl" spellcheck="false">
    </label>
  </main>
  <footer>Start the server with <code>server/run.cmd</code> or <code>docker/up.cmd</code>. Subtitles are plain page text, so Yomitan can scan them.</footer>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
