<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" width="28" height="28">
    <h1>Shisu-ko</h1>
    <!-- The master switch: off means no subtitles, no server requests, no key handling, no Anki
         watching, nothing on the page. Alt+Shift+S flips it too. -->
    <label class="switch" title="Turn Shisu-ko on or off (Alt+Shift+S)">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
      <span id="enabled-label" class="switch-label">On</span>
    </label>
    <div class="statusline">
      <span id="server-status" class="badge">Checking server</span>
      <span id="server-detail" class="detail"></span>
    </div>
  </header>

  <main>
    <div id="permission-banner" class="banner hidden">
      <p>Shisu-ko cannot see YouTube pages yet.</p>
      <button id="grant-permission" type="button">Allow on YouTube</button>
    </div>

    <section>
      <h2>Subtitles</h2>
      <label class="row check">
        <input type="checkbox" id="pauseOnHover">
        <span>Pause video while hovering a line</span>
      </label>
      <label class="row check">
        <input type="checkbox" id="arrowKeysJumpCues">
        <span>Left/Right jump between subtitles</span>
      </label>
      <label class="row check">
        <input type="checkbox" id="showTranscript">
        <span>Transcript panel</span>
        <kbd>Alt+Shift+L</kbd>
      </label>
    </section>

    <section>
      <h2>Mining</h2>
      <label class="row check">
        <input type="checkbox" id="autoMine">
        <span>Auto-attach to new Yomitan cards</span>
      </label>
      <p class="hint"><kbd>Alt+Shift+M</kbd> mines the current line by hand.</p>
    </section>

    <section>
      <h2>Display</h2>
      <label class="row range">
        <span class="lead">Font size</span>
        <output id="fontScaleOut"></output>
        <input type="range" id="fontScale" min="0.6" max="2.2" step="0.05">
      </label>
      <label class="row range">
        <span class="lead">Keep line after speech</span>
        <output id="lingerSecondsOut"></output>
        <input type="range" id="lingerSeconds" min="0" max="1.5" step="0.1">
      </label>
      <label class="row check">
        <input type="checkbox" id="hideNativeCaptions">
        <span>Hide YouTube's own captions</span>
      </label>
      <label class="row check">
        <input type="checkbox" id="showStatus">
        <span>Show progress messages on the video</span>
      </label>
    </section>

    <details>
      <summary>Subtitle style</summary>
      <div class="drawer">
        <label class="row range">
          <span class="lead">Height above the bottom</span>
          <output id="subPositionOut"></output>
          <input type="range" id="subPosition" min="2" max="40" step="1">
        </label>
        <label class="row field">
          <span class="lead">Font</span>
          <select id="subFont">
            <option value="default">Gothic</option>
            <option value="gothic-bold">Gothic bold</option>
            <option value="rounded">Rounded</option>
            <option value="mincho">Mincho</option>
          </select>
        </label>
        <label class="row swatch">
          <span class="lead">Text colour</span>
          <input type="color" id="subTextColor">
        </label>
        <label class="row range">
          <span class="lead">Background</span>
          <output id="subBackgroundOpacityOut"></output>
          <!-- step 4, not 5: it keeps the 72% default and 100% exactly on the grid, so loading the
               popup never snaps the stored value to a neighbour. -->
          <input type="range" id="subBackgroundOpacity" min="0" max="100" step="4">
        </label>
        <label class="row check">
          <input type="checkbox" id="subOutline">
          <span>Outline the text</span>
        </label>
        <label class="row field">
          <span class="lead">Transcript panel side</span>
          <select id="transcriptSide">
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>
        <button type="button" id="reset-style" class="linkbtn">Reset style</button>
      </div>
    </details>

    <details>
      <summary>Anki, clips and server</summary>
      <div class="drawer">
        <label class="row field">
          <span class="lead">Send screenshot and audio to</span>
          <select id="mineTarget">
            <option value="anki">Anki, newest card</option>
            <option value="download">Downloads folder</option>
          </select>
        </label>
        <label class="row check">
          <input type="checkbox" id="mineFallbackDownload">
          <span>Save to Downloads if Anki is unreachable</span>
        </label>
        <label class="row field">
          <span class="lead">AnkiConnect URL</span>
          <input type="text" id="ankiUrl" spellcheck="false">
        </label>
        <div class="grid">
          <label class="row field">
            <span class="lead">Image field</span>
            <input type="text" id="ankiImageField" spellcheck="false">
          </label>
          <label class="row field">
            <span class="lead">Audio field</span>
            <input type="text" id="ankiAudioField" spellcheck="false">
          </label>
        </div>
        <label class="row field">
          <span class="lead">Sentence field <span class="soft">optional, filled only when empty</span></span>
          <input type="text" id="ankiSentenceField" spellcheck="false">
        </label>
        <label class="row field">
          <span class="lead">Word field <span class="soft">optional, first field when empty</span></span>
          <input type="text" id="ankiWordField" spellcheck="false">
        </label>
        <label class="row range">
          <span class="lead">Audio padding</span>
          <output id="clipPaddingMsOut"></output>
          <input type="range" id="clipPaddingMs" min="0" max="1000" step="50">
        </label>
        <label class="row field">
          <span class="lead">Audio format</span>
          <select id="clipFormat">
            <option value="mp3">MP3</option>
            <option value="wav">WAV</option>
          </select>
        </label>
        <label class="row field">
          <span class="lead">Shisu-ko server URL</span>
          <input type="text" id="serverUrl" spellcheck="false">
        </label>
      </div>
    </details>
  </main>

  <script src="browser-api.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
